name: TaliferroMusic
options:
  minimumXcodeGenVersion: 2.38.0
  xcodeVersion: "26.6"
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: tech.taliferro.musicradio
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0
targets:
  TaliferroMusic:
    type: application
    platform: iOS
    sources:
      - path: TaliferroMusic
    # UIBackgroundModes has no INFOPLIST_KEY_ build setting, so it has to live in
    # a real Info.plist (merged with the generated keys) or iOS suspends the
    # stream as soon as the screen locks.
    info:
      path: TaliferroMusic/Support/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        RADIO_API_BASE_URL: $(RADIO_API_BASE_URL)
    settings:
      base:
        PRODUCT_NAME: TaliferroMusic
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "5"
        INFOPLIST_KEY_CFBundleDisplayName: Taliferro Music
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_LSRequiresIPhoneOS: true
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        RADIO_API_BASE_URL: https://radio.taliferro.com
        DEVELOPMENT_TEAM: "6377FLHLAG"
    scheme:
      testTargets: []
